---
deployment:
  tasks:
    # 1. Define target deployment directory on the cPanel server.
    # Note: Replace 'hla00242' with your exact cPanel account username if different.
    # If deploying to the root website: /home/hla00242/public_html/
    # If deploying to a subdirectory:   /home/hla00242/public_html/classweb/
    - export DEPLOYPATH=/home/hla00242/public_html/

    # 2. Ensure target directory exists
    - /bin/mkdir -p $DEPLOYPATH

    # 3. Copy all website files (HTML, CSS, JS, markdown, and subdirectories) to public_html
    - /bin/cp -R * $DEPLOYPATH
